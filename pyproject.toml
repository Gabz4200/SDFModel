[project]
name = "sdfmodel"
version = "0.1.0"
description = "SDFModel - PyTorch Research Scaffolding for Implicit Neural Fields and Signed Distance Functions"
readme = "README.md"
authors = [
    { name = "Joao Gabriel Souza Amaral", email = "jgsa75005@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "einops>=0.8.2",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "sdf",
    "torch>=2.13.0",
    "torch-geometric>=2.8.0.post1",
    "torchao>=0.17.0",
    "torchvision>=0.28.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
find-links = ["https://data.pyg.org/whl/torch-2.12.1+cpu.html"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
sdf = { git = "https://github.com/fogleman/sdf" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
sdfmodel = "sdfmodel:main"
eval-sdfmodel = "sdfmodel.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
]
