model:
  name: "sdf_mlp"
  in_features: 3
  hidden_features: 256
  num_layers: 4
  out_features: 1
  use_fourier_pe: true
  fourier_num_bands: 6

dataset:
  name: "synthetic_sdf"
  num_samples: 4096
  batch_size: 512
  num_workers: 0
  radius: 1.0

training:
  seed: 42
  epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  use_amp: false
  checkpoint_dir: "checkpoints"
  device: "auto"
